# Adds the plugin label (rnKoth, rnChatGames...) chosen in the issue form
name: Label plugin
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const plugins = ['rnKoth', 'rnChatGames', 'rnPsMenu', 'rnCasino', 'rnCombatPvP'];
            const match = (context.payload.issue.body || '').match(/### Plugin\s+(\S+)/);
            if (!match || !plugins.includes(match[1])) return;
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: [match[1]],
            });
